name: Deploy WASM Demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: |
          WB_VER=$(grep -A 1 'name = "wasm-bindgen"' Cargo.lock | grep 'version =' | head -n 1 | cut -d '"' -f 2)
          cargo install wasm-bindgen-cli --version "$WB_VER" --locked

      - name: Build vector_canvas_demo for wasm32-unknown-unknown
        run: cargo build --release --target wasm32-unknown-unknown --example vector_canvas_demo

      - name: Generate WASM JS bindings and bundle
        run: |
          mkdir -p target/wasm_demo
          wasm-bindgen --out-dir target/wasm_demo --target web --no-typescript target/wasm32-unknown-unknown/release/examples/vector_canvas_demo.wasm
          cp index.html target/wasm_demo/index.html
          touch target/wasm_demo/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/wasm_demo
          force_orphan: true
