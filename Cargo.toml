[package]
name = "grafia"
version = "0.7.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jaco Oversluizen", "grafia contributors"]
description = "Interactive 2D cubic Bezier contour, glyph, and vector canvas engine for egui with variable-font master compatibility and stylus brush support."
repository = "https://github.com/oversluizen/grafia"
documentation = "https://docs.rs/grafia"
readme = "README.md"
keywords = ["egui", "bezier", "glyph", "font-editor", "vector-canvas"]
categories = ["gui", "graphics", "rendering::data-formats", "mathematics"]
autotests = false
autoexamples = false

[dependencies]
kurbo = { version = "0.13", features = ["serde"] }
lyon_tessellation = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
egui = { version = "0.37.0", default-features = false }
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[dev-dependencies]
approx = "0.5"
arbtest = "0.3"
rstest = "0.24"
image = "0.25"
proptest = "1.6"
eframe = { version = "0.37.0", features = ["glow", "wgpu"] }
egui-macview = "0.6.3"

