<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Grafia v0.15.0 — Interactive Vector &amp; Icon Studio Demo (WASM)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1a1b1e;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #grafia_canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      outline: none;
      touch-action: none;
    }
    #loading_overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(26, 27, 30, 0.92);
      z-index: 10;
      gap: 14px;
      pointer-events: none;
      transition: opacity 0.2s ease-out;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error_banner {
      display: none;
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 680px;
      width: calc(100vw - 32px);
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 14px 18px;
      z-index: 20;
      font-size: 14px;
      line-height: 1.45;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <canvas id="grafia_canvas"></canvas>
  <div id="loading_overlay">
    <div class="spinner"></div>
    <div>Loading Grafia v0.15.0 Vector &amp; Icon Studio WASM…</div>
  </div>
  <div id="error_banner"></div>
  <script type="module">
    import init from './vector_canvas_demo.js?v=20261125_1029';

    // Tablet Touch & Stylus Bridge for eframe-0.37:
    // 1. eframe-0.37's touchstart/touchmove/touchend listeners already emit PointerButton + PointerMoved + Touch.
    //    Suppressing redundant pointerdown/pointerup for pointerType === 'touch' prevents double-PointerButton
    //    presses from triggering accidental double-clicks when touching a handle.
    // 2. eframe-0.37 installs mousemove/pointerdown/pointerup but has NO pointermove or pointercancel listener.
    //    Forwarding stylus (pointerType === 'pen') pointermove -> document mousemove and pointercancel -> pointerup
    //    enables smooth 120Hz/240Hz stylus handle dragging across iPadOS, Android, and Windows tablets.
    const hasTouchEvents = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    window.addEventListener('pointerdown', (ev) => {
      if (hasTouchEvents && ev.pointerType === 'touch') {
        ev.stopImmediatePropagation();
      }
    }, { capture: true });
    window.addEventListener('pointerup', (ev) => {
      if (hasTouchEvents && ev.pointerType === 'touch') {
        ev.stopImmediatePropagation();
      }
    }, { capture: true });
    window.addEventListener('pointermove', (ev) => {
      if (ev.pointerType === 'pen') {
        document.dispatchEvent(new MouseEvent('mousemove', {
          clientX: ev.clientX,
          clientY: ev.clientY,
          screenX: ev.screenX,
          screenY: ev.screenY,
          button: ev.button,
          buttons: ev.buttons,
          ctrlKey: ev.ctrlKey,
          shiftKey: ev.shiftKey,
          altKey: ev.altKey,
          metaKey: ev.metaKey,
          bubbles: true,
          cancelable: true,
        }));
      }
    }, { passive: true });
    window.addEventListener('pointercancel', (ev) => {
      if (ev.pointerType === 'pen') {
        document.dispatchEvent(new PointerEvent('pointerup', {
          clientX: ev.clientX,
          clientY: ev.clientY,
          pointerId: ev.pointerId,
          pointerType: 'pen',
          button: 0,
          buttons: 0,
          bubbles: true,
          cancelable: true,
        }));
      }
    }, { passive: true });

    const loadingEl = document.getElementById('loading_overlay');
    const errorEl = document.getElementById('error_banner');
    let lastRustPanicMsg = null;

    const origConsoleError = console.error.bind(console);
    console.error = (...args) => {
      origConsoleError(...args);
      const joined = args.map((a) => String(a)).join(' ');
      if (joined.includes('panicked at')) {
        lastRustPanicMsg = joined.split('\n')[0];
      }
    };

    function showError(msg) {
      if (loadingEl) loadingEl.style.display = 'none';
      if (errorEl) {
        errorEl.style.display = 'block';
        const detail = lastRustPanicMsg ? `${msg} (${lastRustPanicMsg})` : msg;
        errorEl.textContent = 'Grafia WASM initialization error: ' + detail;
      }
    }

    window.addEventListener('error', (ev) => {
      if (ev && ev.message) showError(ev.message);
    });
    window.addEventListener('unhandledrejection', (ev) => {
      if (ev && ev.reason) showError(String(ev.reason));
    });

    const probeCanvas = document.createElement('canvas');
    const gl2 = probeCanvas.getContext('webgl2') || probeCanvas.getContext('webgl');
    if (!gl2) {
      showError('WebGL2 / WebGL is not available in this browser.');
    } else {
      init({ module_or_path: './vector_canvas_demo_bg.wasm?v=20261125_1029' })
        .then(() => {
          if (loadingEl) {
            loadingEl.style.opacity = '0';
            setTimeout(() => { loadingEl.style.display = 'none'; }, 220);
          }
        })
        .catch((err) => {
          if (!String(err).includes("Using exceptions for control flow")) {
            showError(String(err));
          }
        });
    }
  </script>
</body>
</html>
